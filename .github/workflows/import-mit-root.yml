name: Import verified MIT source from uploaded ZIP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-mit-root.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mit-root-import
  cancel-in-progress: false

jobs:
  stage-verified-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify user archive against exact upstream MIT commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="6ed1c19bc965b455a1e9e60abc1b35e1bfdeb997"
          EXPECTED_TREE="d7d1143ee58beaf6889d22ec70bbf6edbc41163a"
          git remote add upstream https://github.com/odysseus-dev/odysseus.git
          git fetch --no-tags upstream refs/heads/main
          git cat-file -e "$SOURCE^{commit}"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$EXPECTED_TREE"
          test "$(git show "$SOURCE:LICENSE" | head -n 1)" = "MIT License"
          python3 - <<'PY'
          import hashlib, subprocess, zipfile, pathlib
          source = "6ed1c19bc965b455a1e9e60abc1b35e1bfdeb997"
          archive = pathlib.Path("odysseus-6ed1c19bc965b455a1e9e60abc1b35e1bfdeb997.zip")
          assert archive.is_file(), "Uploaded ZIP is missing"
          records = subprocess.check_output(["git","ls-tree","-r","-z",source]).split(b"\0")
          expected = {}
          for record in records:
              if record:
                  meta, path = record.split(b"\t", 1)
                  mode, kind, sha = meta.decode("ascii").split()
                  assert kind == "blob", (path,kind)
                  expected[path.decode("utf-8")] = (mode,sha)
          def blobhash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          with zipfile.ZipFile(archive) as z:
              infos = [entry for entry in z.infolist() if not entry.is_dir()]
              prefixes = {info.filename.split("/", 1)[0] for info in infos}
              assert len(prefixes) == 1, prefixes
              prefix = next(iter(prefixes)) + "/"
              actual = {}
              for info in infos:
                  assert info.filename.startswith(prefix)
                  path = info.filename[len(prefix):]
                  assert path and not path.startswith("/") and ".." not in path.split("/"), path
                  assert path not in actual, path
                  actual[path] = info
              assert set(actual) == set(expected), (
                  "ZIP file inventory differs from pinned upstream",
                  len(actual), len(expected),
                  sorted(set(expected) - set(actual))[:20],
                  sorted(set(actual) - set(expected))[:20])
              normalized_eol = []
              mismatches = []
              for path, (mode, sha) in expected.items():
                  data = z.read(actual[path])
                  if blobhash(data) == sha:
                      continue
                  if (path.endswith((".ps1",".bat",".cmd"))
                      and blobhash(data.replace(b"\r\n",b"\n")) == sha):
                      normalized_eol.append(path)
                      continue
                  mismatches.append(path)
              assert not mismatches, ("ZIP content differs from pinned upstream",mismatches[:25])
              assert z.read(actual["LICENSE"]).startswith(b"MIT License\n")
          print("VERIFIED uploaded ZIP inventory:",len(expected),"tracked source files")
          print("VERIFIED exact contents, allowing historical Windows EOL expansion:",len(normalized_eol))
          print("VERIFIED historical Git source tree: d7d1143ee58beaf6889d22ec70bbf6edbc41163a")
          PY
      - name: Build a candidate tree while staging workflow files separately
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="6ed1c19bc965b455a1e9e60abc1b35e1bfdeb997"
          BASE=$(git rev-parse HEAD)
          BOOTSTRAP_BLOB=$(git rev-parse "$BASE:.github/workflows/import-mit-root.yml")
          WORKFLOWS_TREE=$(git rev-parse "$SOURCE:.github/workflows")
          test "$WORKFLOWS_TREE" = "fb80df02ea4950a085c925b7abb97497636fffe6"
          git read-tree "$SOURCE^{tree}"
          python3 - <<'PY'
          import subprocess
          source = "6ed1c19bc965b455a1e9e60abc1b35e1bfdeb997"
          records = subprocess.check_output(
              ["git","ls-tree","-r","-z",source,".github/workflows"]).split(b"\0")
          moved = 0
          for record in records:
              if not record:
                  continue
              meta, path = record.split(b"\t",1)
              mode, kind, sha = meta.decode("ascii").split()
              path = path.decode("utf-8")
              assert kind == "blob" and path.startswith(".github/workflows/")
              dest = "_mit_source_workflows/" + path[len(".github/workflows/"):]
              subprocess.run(["git","update-index","--add","--cacheinfo",
                              ",".join((mode,sha,dest))],check=True)
              subprocess.run(["git","update-index","--force-remove",path],check=True)
              moved += 1
          assert moved == 4, moved
          print("Temporarily relocated", moved, "original workflow files")
          PY
          git update-index --add --cacheinfo "100644,$BOOTSTRAP_BLOB,.github/workflows/import-mit-root.yml"
          CANDIDATE_TREE=$(git write-tree)
          test "$(git rev-parse "$CANDIDATE_TREE:_mit_source_workflows")" = "$WORKFLOWS_TREE"
          test "$(git rev-parse "$CANDIDATE_TREE:LICENSE")" = "7087e2d598700ecb40f09a0fbf3f12952fcf641e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CANDIDATE=$(git commit-tree "$CANDIDATE_TREE" -p "$BASE" -m "Stage exact historical MIT source at repository root")
          git push origin "$CANDIDATE:refs/heads/extract-mit-source-candidate"
          echo "CANDIDATE_SHA=$CANDIDATE"
          echo "SOURCE_SHA=$SOURCE"
          echo "SOURCE_TREE=d7d1143ee58beaf6889d22ec70bbf6edbc41163a"
          echo "Original workflow files are staged in _mit_source_workflows until reviewed and promoted by connected GitHub tooling"
